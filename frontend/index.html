<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="แดชบอร์ดสรุปยอดขาย xBloom" />
    <title>xBloom Sale Dashboard</title>
    <!-- favicon / ไอคอนแท็บเบราว์เซอร์ (โลโก้ xBloom) -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- ฟอนต์ LINE Seed Sans TH โหลดแบบ self-host ผ่าน @font-face ใน src/index.css -->
  </head>
  <body>
    <div id="root">
      <!-- ตัวโหลดตอนบูต (inline) — โผล่ทันทีก่อน React/บันเดิลโหลดเสร็จ กันจอขาว
           React จะแทนที่เนื้อใน #root เมื่อ mount ตัวนี้จึงหายไปเอง -->
      <div
        id="boot-loader"
        style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f8fafc;"
      >
        <div style="display:flex;flex-direction:column;align-items:center;gap:18px;">
          <img
            src="/xbloom-logo.png"
            alt=""
            width="56"
            height="56"
            style="border-radius:16px;box-shadow:0 10px 25px -5px rgba(15,23,42,.18);"
          />
          <div
            style="width:28px;height:28px;border:3px solid #e2e8f0;border-top-color:#4f46e5;border-radius:9999px;animation:boot-spin .7s linear infinite;"
          ></div>
        </div>
      </div>
      <style>
        @keyframes boot-spin {
          to {
            transform: rotate(360deg);
          }
        }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
