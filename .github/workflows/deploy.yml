name: Deploy

# push เข้า main → test + deploy บน VPS (self-hosted runner ทั้งคู่ ไม่พึ่ง GitHub-hosted
# ที่คิว/หมด Actions minutes ได้) → แจ้ง Discord (best-effort บน runner ของ GitHub)
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: Test & build
    # รันบน self-hosted (VPS) เอง — ไม่พึ่ง GitHub-hosted runner ที่อาจคิว/หมด minutes
    # (deploy job needs: test จึงเป็น gate ที่ยังทำงาน แต่ไม่ติด GitHub-hosted อีก)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install backend deps
        working-directory: backend
        run: npm ci
      - name: Backend tests
        working-directory: backend
        run: npm test
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Frontend build
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy on VPS
    needs: test
    runs-on: self-hosted
    # ไม่มี third-party action ในงานนี้ → "Set up job" ไม่ต้องโหลดอะไรจากเน็ต
    # (self-hosted runner บน VPS ที่ออกเน็ตจำกัดจะได้ไม่พังตอน setup)
    steps:
      - name: Deploy + health check + rollback
        run: |
          set -euo pipefail
          cd /data/apps/sale-dashboard

          # เสิร์ฟใต้ /sales/ → build frontend ด้วย base=/sales/ (compose อ่าน ${VITE_BASE})
          export VITE_BASE=/sales/

          PREV="$(git rev-parse HEAD)"
          echo "==> current: $PREV"
          # ดึงจาก HTTPS ตรง ๆ + เมิน git config global/system ของ VPS
          # (กัน remote ที่เป็น SSH หรือ insteadOf ที่ rewrite https->ssh → Permission denied publickey)
          GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null \
            git fetch https://github.com/B0atByte/sale-dashboardXB.git main
          git reset --hard FETCH_HEAD
          echo "==> deploying: $(git rev-parse HEAD)"

          docker compose build
          docker compose up -d

          # health check (retry ~60s) กับ URL production จริง
          ok=0
          for _ in $(seq 1 20); do
            if curl -fsS https://bh.b-happiness.co.th/sales/ >/dev/null 2>&1; then ok=1; break; fi
            sleep 3
          done

          if [ "$ok" -eq 1 ]; then
            echo "OK — health check ผ่าน"
            docker image prune -f >/dev/null 2>&1 || true
          else
            echo "!!! health check ล้มเหลว — rollback ไป $PREV"
            git reset --hard "$PREV"
            docker compose build
            docker compose up -d
            exit 1
          fi

  notify:
    name: Notify Discord
    needs: [deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord
        uses: tsickert/discord-webhook@v6
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          username: CI/CD
          avatar-url: https://i.imgur.com/4M34hi2.png
          title: |
            ${{ needs.deploy.result == 'success' && '✅ Deploy สำเร็จ' || '❌ Deploy ล้มเหลว' }}
          description: |
            **xBloom Sale Dashboard**
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Status: ${{ needs.deploy.result }}
