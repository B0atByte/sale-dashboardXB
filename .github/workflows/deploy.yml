name: Deploy

# push เข้า main → test → deploy บน VPS (self-hosted runner ติดตั้งบน VPS เอง จึงรันตรงได้ ไม่ต้อง SSH)
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Backend tests
        working-directory: backend
        run: npm ci && npm test
      - name: Frontend build
        working-directory: frontend
        run: npm ci && npm run build

  deploy:
    name: Deploy on VPS
    needs: test
    runs-on: self-hosted
    steps:
      - name: Deploy + health check + rollback
        run: |
          set -euo pipefail
          cd /data/apps/sale-dashboard

          PREV="$(git rev-parse HEAD)"
          echo "==> current: $PREV"
          git fetch origin main
          git reset --hard origin/main
          echo "==> deploying: $(git rev-parse HEAD)"

          docker compose build
          docker compose up -d

          # health check (retry ~60s) กับ URL production จริง
          ok=0
          for _ in $(seq 1 20); do
            if curl -fsS https://bh.b-happiness.co.th/sales/ >/dev/null 2>&1; then ok=1; break; fi
            sleep 3
          done

          if [ "$ok" -eq 1 ]; then
            echo "OK — health check ผ่าน"
            docker image prune -f >/dev/null 2>&1 || true
          else
            echo "!!! health check ล้มเหลว — rollback ไป $PREV"
            git reset --hard "$PREV"
            docker compose build
            docker compose up -d
            exit 1
          fi

      - name: Notify Discord
        if: always()
        uses: tsickert/discord-webhook@v6
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          username: CI/CD
          avatar-url: https://i.imgur.com/4M34hi2.png
          title: |
            ${{ job.status == 'success' && '✅ Deploy สำเร็จ' || '❌ Deploy ล้มเหลว' }}
          description: |
            **xBloom Sale Dashboard**
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Status: ${{ job.status }}
